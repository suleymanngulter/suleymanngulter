name: Generate profile graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restore last generated assets
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: output
          path: previous-output

      - name: Seed dist from previous output
        run: |
          mkdir -p dist
          if [ -d previous-output ]; then
            find previous-output -maxdepth 1 -type f -name '*.svg' -exec cp {} dist/ \;
          fi

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: suleymanngulter
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=suleymanngulter&show_icons=true&theme=tokyonight&hide_border=true
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Snapshot streak card
        continue-on-error: true
        run: |
          tmp="$(mktemp)"
          curl -fsSL --retry 5 --retry-delay 3 \
            "https://streak-stats.demolab.com/?user=suleymanngulter&theme=tokyonight&hide_border=true" \
            -o "$tmp"
          grep -q '<svg' "$tmp"
          mv "$tmp" dist/github-streak.svg

      - name: Push generated assets to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
